# Simulated month (branch `simulacion`). Started by sim/up.sh; secrets come from sim/out/sim.env.
name: bulk-mailer-sim

x-image: &image
  image: bulk-mailer-sim
  env_file: ./out/sim.env

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: bulk_mailer
      POSTGRES_USER: bulk_mailer
      POSTGRES_PASSWORD: ${OWNER_DB_PASSWORD}
    ports: ["55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bulk_mailer -d bulk_mailer"]
      interval: 2s
      timeout: 3s
      retries: 30

  tayrona:
    <<: *image
    command: ["node", "mocks/contracts-api.ts"]
    environment: { HOST: 0.0.0.0, PORT: "4001", MOCK_CONTRACTS_FILE: /sim/data/tayrona.json, MOCK_TOKEN: "${TAYRONA_API_TOKEN}" }
    volumes: ["./out:/sim:ro"]

  sap:
    <<: *image
    command: ["node", "mocks/contracts-api.ts"]
    environment: { HOST: 0.0.0.0, PORT: "4001", MOCK_CONTRACTS_FILE: /sim/data/sap.json, MOCK_TOKEN: "${SAP_API_TOKEN}" }
    volumes: ["./out:/sim:ro"]

  zeptomail:
    <<: *image
    command: ["node", "mocks/zeptomail-api.ts"]
    environment:
      HOST: 0.0.0.0
      PORT: "4002"
      MOCK_API_KEY: "${ZEPTOMAIL_API_KEY}"
      MOCK_VERIFIED_DOMAINS: anutibara.com
      MOCK_OAUTH_TOKEN: "${ZEPTO_OAUTH_TOKEN}"
      MOCK_OAUTH_CLIENT_ID: "${ZOHO_OAUTH_CLIENT_ID}"
      MOCK_OAUTH_CLIENT_SECRET: "${ZOHO_OAUTH_CLIENT_SECRET}"
      MOCK_OAUTH_REFRESH_TOKEN: "${ZOHO_OAUTH_REFRESH_TOKEN}"
      MOCK_WEBHOOK_URL: https://app:3443/webhooks/zeptomail
      MOCK_WEBHOOK_KEY: "${ZEPTOMAIL_WEBHOOK_KEY}"
      MOCK_WEBHOOK_AUTH_NAME: authorization
      MOCK_WEBHOOK_AUTH_VALUE: "${ZEPTOMAIL_WEBHOOK_AUTHORIZATION}"
      MOCK_EVENT_DELAY_MS: "1000"
      MOCK_EVENT_DELAY_MAX_MS: "5000"
      NODE_EXTRA_CA_CERTS: /sim/tls/cert.pem
    volumes: ["./out:/sim:ro"]

  provision:
    <<: *image
    command: ["sh", "-c", "node dist/adapters/outbound/postgres/migrate.js && node sim/provision.ts"]
    environment:
      # Only the migration's config load: it needs the database, nothing else.
      NODE_ENV: development
      DATA_DIR: /tmp/data
      DATABASE_URL: postgres://bulk_mailer:${OWNER_DB_PASSWORD}@postgres:5432/bulk_mailer
      OWNER_DATABASE_URL: postgres://bulk_mailer:${OWNER_DB_PASSWORD}@postgres:5432/bulk_mailer
    volumes: ["./out:/sim:ro"]
    depends_on: { postgres: { condition: service_healthy } }

  app: &app
    <<: *image
    command: ["node", "dist/main.js"]
    ports: ["3443:3443"]
    # D33: the process waits up to SHUTDOWN_TIMEOUT_SECONDS for the send in progress; Docker must wait longer.
    stop_grace_period: 40s
    environment: &app-env
      PORT: "3443"
      DATA_DIR: /data
      DATABASE_URL: postgres://bulk_mailer_app:${APP_DB_PASSWORD}@postgres:5432/bulk_mailer
      TLS_CERT_FILE: /sim/tls/cert.pem
      TLS_KEY_FILE: /sim/tls/key.pem
      # D49: required in production (the simulation has no web client; an exact origin anyway)
      CORS_ALLOWED_ORIGINS: https://localhost:5173
      CONTRACT_SOURCE: http
      TAYRONA_API_URL: http://tayrona:4001
      SAP_API_URL: http://sap:4001
      EMAIL_PROVIDER: zeptomail
      ZEPTOMAIL_BASE_URL: http://zeptomail:4002/v1.1
      ZOHO_ACCOUNTS_URL: http://zeptomail:4002
      ZEPTOMAIL_FROM_ADDRESS: soportes@anutibara.com
      ARCHIVE_COPY_ADDRESS: archivo@anutibara.com
      SEND_PAUSE_MS: "1000"
      SEND_WAIT_FOR_DELIVERY: "true"
      DELIVERY_WAIT_MAX_SECONDS: "120"
      DELIVERY_WAIT_LOOKUP_SECONDS: "30"
      RECONCILE_DELAYS_MINUTES: "1,2,3"
      DELIVERY_CHECK_TAIL_MINUTES: "3"
      # Audit (D32-D53), accelerated where the month must show it: the sweep looks at sends older than 1 h every
      # 5 min (a lost webhook of batch 1 must be found before the month ends); orphan files are swept every 10 min.
      RECONCILE_SWEEP_AFTER_HOURS: "1"
      RECONCILE_SWEEP_MAX_HOURS: "72"
      RECONCILE_SWEEP_INTERVAL_MINUTES: "5"
      RECONCILE_SWEEP_BATCH_SIZE: "50"
      DELIVERY_CHECK_BATCH_SIZE: "20"
      FILE_ORPHAN_SWEEP_INTERVAL_MINUTES: "10"
      FILE_ORPHAN_MIN_AGE_MINUTES: "5"
      # Exactly one batch fits in a request: the 51st file must be refused with 413 (D48)
      UPLOAD_MAX_FILES: "50"
      UPLOAD_MAX_TOTAL_BYTES: "209715200"
      WORK_RETENTION_DAYS: "30"
      MAX_ATTACHMENT_BYTES: "15728640"
      AUTH_RATE_LIMIT_PER_MINUTE: "60"
      INSTANCE_LEASE_TTL_SECONDS: "30"
      EXECUTION_ABORT_AFTER_MINUTES: "10"
      SHUTDOWN_TIMEOUT_SECONDS: "25"
    volumes: ["./out:/sim:ro", "appdata:/data"]
    depends_on:
      provision: { condition: service_completed_successfully }
      tayrona: { condition: service_started }
      sap: { condition: service_started }
      zeptomail: { condition: service_started }

  # D47: a second replica against the same database and volume (started on demand by sim/run.sh): it must serve HTTP
  # and stay standby while the first one holds the lease.
  app2:
    <<: *app
    profiles: ["two"]
    ports: ["3444:3444"]
    environment:
      <<: *app-env
      PORT: "3444"
    depends_on:
      app: { condition: service_started }

  runner:
    <<: *image
    profiles: ["run"]
    command: ["node", "sim/run.ts"]
    environment:
      APP_URL: https://app:3443
      APP2_URL: https://app2:3444
      # Requests to the host (stop/start containers) and read-only view of the receipt files volume
      SIM_CONTROL: /sim/control
      APP_DATA_DIR: /appdata
      REPORT_DATABASE_URL: postgres://bulk_mailer:${OWNER_DB_PASSWORD}@postgres:5432/bulk_mailer
      ZEPTO_URL: http://zeptomail:4002
      SIM_OUT: /sim
      ARCHIVE_COPY_ADDRESS: archivo@anutibara.com
      NODE_EXTRA_CA_CERTS: /sim/tls/cert.pem
    volumes: ["./out:/sim", "appdata:/appdata:ro"]
    depends_on: { app: { condition: service_started } }

volumes:
  appdata:
