services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: bulk_mailer
      POSTGRES_USER: bulk_mailer
      POSTGRES_PASSWORD: bulk_mailer_local
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bulk_mailer -d bulk_mailer"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
